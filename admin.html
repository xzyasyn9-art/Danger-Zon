function nw(){$('#v').innerHTML=`<datalist id="acs">${us.map(u=>`<option value="${E(u.name)}">`).join('')}</datalist><h2>انتخاب جديد</h2><input id="ti" placeholder="سؤال الانتخاب"><div id="ops"></div><button class="s" onclick="addOpt()">+ إضافة خيار</button><button class="s" onclick="pickAccs()">+ اختيار حسابات تتنافس</button><div class="row"><input id="du" type="number" min="1" value="1"><select id="un"><option value="m">دقيقة</option><option value="h" selected>ساعة</option><option value="d">يوم</option><option value="w">أسبوع</option></select></div><label class="m">يبدأ بعد كام دقيقة (0 = فورًا)</label><input id="st" type="number" min="0" value="0"><button onclick="pub()">نشر الانتخاب</button><p id="er" class="m"></p>`;addOpt();addOpt()}

async function msg(){const s=await D.collection('msgs').orderBy('t','desc').limit(100).get();$('#v').innerHTML=s.docs.map(d=>{const m=d.data();return `<div class="u" style="flex-direction:column;align-items:stretch"><span><b>${E(m.name)}</b> <small class="m">${new Date(m.t).toLocaleString('ar-EG')}</small><br>${E(m.text)}</span>${m.reply?`<span class="m" style="color:var(--a)">ردّك: ${E(m.reply)}</span>`:''}<div class="row"><input id="r-${d.id}" placeholder="اكتب الرد"><button onclick="rep('${d.id}')">رد</button><button class="s" onclick="dm('${d.id}')">حذف</button></div></div>`}).join('')||'<p class="m">مفيش رسائل.</p>'}

async function setup(){const n=$('#n').value.trim(),k=$('#k').value;if(!n||k.length<6)return $('#er').textContent='اكتب اسمًا ورمزًا من 6 أحرف على الأقل';
 window._setup=1;let c;try{c=await A.createUserWithEmailAndPassword(em(n),k)}catch(e){window._setup=0;return $('#er').textContent=e.code=='auth/email-already-in-use'?'الاسم ده مستخدم، اختار اسم تاني':e.message}
 const u=c.user.uid,b=D.batch();b.set(D.doc('users/'+u),{name:n,code:rc(),followers:0,votes:0,secs:0});b.set(D.doc('admins/'+u),{ok:true});b.set(D.doc('config/locked'),{by:u});
 try{await b.commit();window._setup=0;location.reload()}catch(e){try{await c.user.delete()}catch(x){}window._setup=0;login('تم إنشاء حساب إدارة قبل كده، أو تعذر الإنشاء: '+e.message)}}

const F=firebase.firestore.FieldValue,nf=n=>(n||0).toLocaleString('ar-EG');
const GE='🌹وردة,🌷توليب,🌼زهرة,🍀برسيم,🍬حلوى,🍭مصاصة,🍪كوكيز,🍩دونات,🍫شوكولاتة,🍦آيس كريم,☕قهوة,🍕بيتزا,🍔برجر,🎈بالون,🎀فيونكة,⭐نجمة,💌رسالة,🧸دبدوب,🎵نغمة,🎶لحن,🐱قطة,🐶كلب,🐰أرنب,🦊ثعلب,🐼باندا,🐨كوالا,🐯نمر صغير,🐴حصان,🦄يونيكورن,🐬دلفين,🦋فراشة,🦜ببغاء,🐢سلحفاة,🐘فيل,🦒زرافة,🐧بطريق,🦉بومة,🐻دب,🐺ذئب,🦅نسر,💖قلب,💝قلب هدية,💎ألماسة,💍خاتم,👑تاج,🏆كأس,🥇ميدالية,🎖وسام,🚗سيارة,🏎سيارة سباق,🚁هليكوبتر,✈طائرة,🚀صاروخ,🛥يخت,🏰قلعة,🌋بركان,🌈قوس قزح,🌙هلال,☀شمس,🌍كوكب,🦁أسد,🐉تنين,🦈قرش,🐅نمر,🐆فهد,🐊تمساح,🦏وحيد القرن,🐎حصان أصيل,🔥نار,⚡برق,🌪إعصار,🌊موجة,❄جليد,🗡سيف,🛡درع,🏹قوس,🔱رمح,🪄عصا سحرية,🧿عين,💰كنز,🪙عملة ذهب,🏅ميدالية ذهبية,🎆ألعاب نارية,🎇شرارات,🌠شهاب,🛸طبق طائر,🛰قمر صناعي,🗽تمثال,🕌مسجد,🏯قصر,🗼برج,🏝جزيرة,🌌مجرة,🪐زحل,☄مذنب,🔮كرة سحرية,📿سبحة,🎭قناع,🎡عجلة,🪁طائرة ورقية'.split(',');
async function seed(){const b=D.batch();GE.slice(0,100).forEach((x,i)=>{const e=[...x][0]==='\u200d'?x:String.fromCodePoint(x.codePointAt(0)),n=x.slice(e.length);b.set(D.doc('gifts/g'+String(i).padStart(3,'0')),{e,n,price:Math.max(5,Math.round(10*Math.pow(1.095,i)/5)*5),pts:1+Math.floor(i/12),o:i})});await b.commit();alert('✓ تم تحميل الهدايا');tab('sum')}
async function sum(){const v=pl.reduce((x,p)=>x+(p.n||0),0),t=us.reduce((x,u)=>x+(u.secs||0),0),c=us.reduce((x,u)=>x+(u.coins||0),0),st=await D.doc('config/stats').get(),gs=await D.collection('gifts').get();
 $('#v').innerHTML=`<div class="k"><div><b>${us.length}</b>حساب</div><div><b>${pl.length}</b>انتخاب</div><div><b>${v}</b>إجمالي الأصوات</div><div><b>${ft(t)}</b>وقت الاستخدام</div><div><b>🪙 ${nf(c)}</b>عملات عند الحسابات</div><div><b>🪙 ${nf(st.exists?st.data().profit:0)}</b>مكسب الإدارة</div></div><button class="s" onclick="seed()">${gs.size?'إعادة تحميل الهدايا':'تحميل الهدايا (100)'} — الحالي ${gs.size}</button>`}
function acc(){$('#v').innerHTML=`<div class="u" style="flex-direction:column;align-items:stretch;gap:6px"><b>إضافة عملات بالكود</b><div class="row"><input id="cc" inputmode="numeric" maxlength="11" placeholder="كود الحساب (11 رقم)"><input id="cm" type="number" min="1" placeholder="المبلغ"></div><button onclick="byCode()">إضافة</button><p id="er" class="m"></p></div><select id="lm" onchange="lst()"><option>10</option><option>50</option><option>100</option><option value="9999">الكل</option></select><select id="so" onchange="lst()"><option value="secs">الأكثر وقتًا في التطبيق</option><option value="coins">الأكثر عملات</option><option value="votes">الأكثر تصويتًا</option><option value="followers">الأكثر متابعين</option></select><div id="ul"></div>`;lst()}
function lst(){const k=+$('#lm').value,f=$('#so').value;$('#ul').innerHTML=[...us].sort((x,y)=>(y[f]||0)-(x[f]||0)).slice(0,k).map((u,i)=>`<div class="u" onclick="acd('${u.id}')" style="cursor:pointer"><span><b>${i+1}. ${E(u.name)}</b>${u.banned?' 🚫':''}${u.warn?' ⚠':''}<br><small class="m">كود ${u.code} • ${u.followers||0} متابع</small></span><span class="m">🪙 ${nf(u.coins)}<br>${ft(u.secs)}</span></div>`).join('')}
function byCode(){const u=us.find(x=>x.code==$('#cc').value.trim()),n=Math.floor(+$('#cm').value);if(!u||!(n>0))return $('#er').textContent='كود غلط أو مبلغ غلط';coin(u.id,1,n,'')}
async function coin(id,sg,n,note){n=Math.floor(n);if(!(n>0))return;const b=D.batch();b.update(D.doc('users/'+id),{coins:F.increment(sg*n)});b.set(D.collection('ledger').doc(),{u:id,type:sg>0?'add':'take',amt:sg*n,by:me.uid,t:Date.now(),note:note||''});await b.commit();await load();acd(id)}

async function acd(id){const u=us.find(x=>x.id==id);$('#v').innerHTML='<p class="m">جاري التحميل...</p>';
 const[l,g,vt,ma,mb]=await Promise.all([D.collection('ledger').where('u','==',id).get(),D.collection('giftlog').where('u','==',id).get(),D.collection('votes').where('u','==',id).get(),D.collection('matches').where('a','==',id).get(),D.collection('matches').where('b','==',id).get()]);
 const L=l.docs.map(d=>d.data()),G=g.docs.map(d=>d.data()),exp=L.reduce((x,y)=>x+y.amt,0)-G.reduce((x,y)=>x+y.price,0),bad=exp!=(u.coins||0);
 const T={add:'إضافة من الإدارة',take:'سحب من الإدارة',refund:'استرجاع هدية',prize:'جائزة مسابقة'},ev=[...L.map(x=>({t:x.t,s:`${x.amt>0?'+':''}${nf(x.amt)} ${T[x.type]||x.type} ${E(x.note||'')}`})),...G.map(x=>({t:x.t,s:`-${nf(x.price)} هدية ${E(x.gn)} على خيار ${+x.opt+1} في «${E(x.pt)}»${x.res?(x.res=='lose'?' (خسرت)':' (استُرجعت)'):''}`}))].sort((x,y)=>y.t-x.t);
 const th=[...ma.docs,...mb.docs].map(d=>d.data()).filter(m=>m.w).map(m=>`<div class="u"><span>ضد ${E((m.a==id?m.bn:m.an)||'—')}</span><b>${m.w==id?'فاز':'خسر'}</b></div>`).join('')||'<p class="m">لا يوجد</p>';const vh=vt.docs.map(d=>d.data()).sort((x,y)=>(y.t||0)-(x.t||0)).slice(0,20).map(x=>{const p=pl.find(q=>q.id==x.p);return p?`<div class="u"><span>${E(p.title)}</span><b>${E((p.o[x.c]||{}).x||'')}</b></div>`:''}).join('')||'<p class="m">لا يوجد</p>';
 $('#v').innerHTML=`<button class="s" onclick="tab('acc')">← رجوع</button><h2>${E(u.name)} ${u.banned?'🚫':''}</h2><div class="u"><span>الرصيد الحالي</span><b>🪙 ${nf(u.coins)}</b></div>${bad?`<div class="u" style="border:1px solid #ff8a80"><span>⚠ الرصيد لا يطابق السجل (المتوقع ${nf(exp)}). احتمال اختراق.</span></div>`:'<p class="m">✓ الرصيد يطابق السجل</p>'}
<div class="row"><input id="ca" type="number" min="1" placeholder="المبلغ"><input id="cn" placeholder="ملاحظة"></div><div class="row"><button onclick="coin('${id}',1,+$('#ca').value,$('#cn').value)">+ إضافة</button><button class="s" onclick="coin('${id}',-1,+$('#ca').value,$('#cn').value)">− سحب</button></div>
<h3>تحذير / إيقاف</h3><textarea id="wt" rows="2">${E(u.warn||'تم رصد نشاط مخالف على حسابك. استمراره سيؤدي إلى إيقاف الحساب.')}</textarea><div class="row"><button onclick="warn('${id}',1)">إرسال تحذير</button><button class="s" onclick="warn('${id}',0)">إزالة التحذير</button></div><button class="s" onclick="ban('${id}',${u.banned?0:1})">${u.banned?'رفع الإيقاف':'إيقاف الحساب'}</button>
<button class="s" style="color:#ff8a80" onclick="delAcc('${id}')">🗑 حذف الحساب نهائيًا</button><h3>سجل العملات والهدايا</h3>${ev.map(x=>`<div class="u"><span>${x.s}<br><small class="m">${new Date(x.t).toLocaleString('ar-EG')}</small></span></div>`).join('')||'<p class="m">لا يوجد</p>'}<h3>صوّت على</h3>${vh}<h3>المسابقات</h3>${th}`}
async function settle(){const now=Date.now();for(const p of pl){if(p.end>now||p.settled)continue;const gs=await D.collection('giftlog').where('poll','==',p.id).get(),open=gs.docs.filter(d=>!d.data().res);
 const vs=p.o.map((_,i)=>((p.v||{})[i]||0)+((p.g||{})[i]||0)),mx=Math.max(...vs),win=vs.filter(x=>x==mx).length==1?String(vs.indexOf(mx)):null;let profit=0;const b=D.batch();
 open.slice(0,140).forEach(d=>{const x=d.data(),gone=!us.find(z=>z.id==x.u),ok=!gone&&(win===null||x.opt==win);b.update(d.ref,{res:ok?'refund':'lose'});if(ok){b.update(D.doc('users/'+x.u),{coins:F.increment(x.price)});b.set(D.collection('ledger').doc(),{u:x.u,type:'refund',amt:x.price,t:Date.now(),note:'استرجاع هدية: '+x.pt,by:me.uid})}else profit+=x.price});
 if(open.length<=140&&win!==null&&p.prize>0){const o=p.o[+win];if(o&&o.acc&&us.find(z=>z.id==o.acc)){b.update(D.doc('users/'+o.acc),{coins:F.increment(p.prize)});b.set(D.collection('ledger').doc(),{u:o.acc,type:'prize',amt:p.prize,t:Date.now(),note:'جائزة انتخاب: '+p.title,by:me.uid})}}
 if(profit)b.set(D.doc('config/stats'),{profit:F.increment(profit)},{merge:true});if(open.length<=140)b.update(D.doc('polls/'+p.id),{settled:true});await b.commit()}}
function pickAccs(){const d=document.createElement('div');d.className='u';d.style.cssText='flex-direction:column;align-items:stretch';d.innerHTML='<b>اختر الحسابات</b>'+us.map(u=>`<label><input type="checkbox" class="pk" value="${u.id}" style="width:auto"> ${E(u.name)}</label>`).join('')+'<button onclick="addPk(this)">أضفهم كخيارات</button>';$('#ops').after(d)}
function addPk(b){document.querySelectorAll('#ops .o').forEach(r=>{if(!r.querySelector('.tx').value&&!r.querySelector('.ur').value)r.remove()});document.querySelectorAll('.pk:checked').forEach(c=>{const u=us.find(x=>x.id==c.value);addOpt();const r=[...document.querySelectorAll('#ops .o')].pop();r.querySelector('.ty').value='account';r.querySelector('.tx').value=u.name;r.dataset.acc=u.id});b.parentElement.remove()}

const nm=(m,s)=>m[s]=='BYE'?'—':(m[s+'n']||'؟');
function bracket(x,ms){if(x.type=='league'){const P={};Object.entries(x.players||{}).forEach(([k,v])=>P[k]={n:v,p:0,w:0,l:0});ms.filter(m=>m.w).forEach(m=>{if(m.w=='tie'){if(P[m.a])P[m.a].p++;if(P[m.b])P[m.b].p++;return}const lo=m.w==m.a?m.b:m.a;if(P[m.w]){P[m.w].p+=3;P[m.w].w++}if(P[lo])P[lo].l++});
 const R=Object.entries(P).sort((a,b)=>b[1].p-a[1].p||b[1].w-a[1].w);return `<small class="m">الباقي ${ms.filter(m=>!m.w).length} مباراة</small>`+R.map((r,i)=>`<div class="u"><span>${i+1}. ${E(r[1].n)}</span><b>${r[1].p} نقطة (${r[1].w}-${r[1].l})</b></div>`).join('')}
 const rs=[...new Set(ms.map(m=>m.r))].sort((a,b)=>a-b),top=rs[rs.length-1],lab=r=>r==top?'النهائي':r==top-1?'نصف النهائي':r==top-2?'ربع النهائي':'الدور '+Math.pow(2,top-r+1);
 return '<div class="wc">'+rs.map(r=>`<b class="wt">${lab(r)}</b>`+ms.filter(m=>m.r==r).map(m=>{const sd=s=>`<span class="${m.w?(m.w==m[s]?'w':'x'):''}">${m.w&&m.w==m[s]?'✅ ':m.w?'❌ ':''}${E(nm(m,s))}</span>`;return `<div class="mt">${sd('a')}<b>${m.wa}-${m.wb}</b>${sd('b')}</div>`}).join('')).join('')+'</div>'}
function fill(M){M.forEach(m=>{['a','b'].forEach(s=>{const sr=m['s'+s];if(m[s]||!sr)return;const src=M.find(x=>x.id==sr);if(src&&src.w){m[s]=src.w;m[s+'n']=src.w==src.a?src.an:src.bn;D.doc('matches/'+m.id).update({[s]:m[s],[s+'n']:m[s+'n']}).catch(()=>{})}})})}

async function trn(){const[t,m]=await Promise.all([D.collection('tourneys').orderBy('created','desc').get(),D.collection('matches').get()]),T=t.docs.map(d=>({id:d.id,...d.data()})),M=m.docs.map(d=>({id:d.id,...d.data()}));fill(M);
 $('#v').innerHTML=`<h2>مسابقة جديدة</h2><input id="tn" placeholder="اسم المسابقة (مثلا دوري 2026)"><select id="tt"><option value="league">دوري (الكل ضد الكل)</option><option value="cup">كأس (خروج مغلوب)</option></select><input id="tm" type="number" placeholder="أقصى عدد لاعبين (الدوري 20)"><select id="tg"><option value="xo">لعبة XO</option><option value="state">لعبة ستيت (احتلال)</option></select><div class="row"><input id="p1" type="number" placeholder="جائزة 1"><input id="p2" type="number" placeholder="جائزة 2"><input id="p3" type="number" placeholder="جائزة 3"></div><button onclick="tnew()">إنشاء وفتح التسجيل</button>`+
 T.map(x=>`<div class="u" style="flex-direction:column;align-items:stretch"><b>${E(x.name)} • ${x.type=='cup'?'كأس':'دوري'} • ${({open:'التسجيل مفتوح',running:'شغّالة',done:'انتهت'})[x.status]}</b><small class="m">${Object.keys(x.players||{}).length} لاعب • جوائز ${(x.prizes||[]).map(nf).join(' / ')}</small>${x.status=='open'?`<button onclick="tstart('${x.id}')">بدء المسابقة</button>`:''}${x.status=='running'?`<button onclick="tend('${x.id}')">إنهاء وتوزيع الجوائز</button>`:''}${x.status!='open'?bracket(x,M.filter(y=>y.t==x.id)):preview(x)}<button class="s" onclick="tdel('${x.id}')">حذف</button></div>`).join('')}
async function tnew(){const n=$('#tn').value.trim();if(!n)return;await D.collection('tourneys').add({name:n,type:$('#tt').value,prizes:[+$('#p1').value||0,+$('#p2').value||0,+$('#p3').value||0],status:'open',game:$('#tg').value,max:+$('#tm').value||($('#tt').value=='league'?20:16),players:{},created:Date.now()});trn()}
async function tstart0(id){const t=(await D.doc('tourneys/'+id).get()).data(),ps=Object.entries(t.players||{});if(ps.length<2)return alert('محتاج لاعبين اتنين على الأقل');const b=D.batch(),mk=o=>{const r=D.collection('matches').doc();b.set(r,{t:id,board:'---------',turn:'a',g:1,wa:0,wb:0,w:'',st:'play',a:'',b:'',an:'',bn:'',sa:'',sb:'',r:1,gm:t.game||'xo',seed:Math.floor(Math.random()*1e9),...o});return r.id};let rounds=1;
 if(t.type=='league'){for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++)mk({a:ps[i][0],an:ps[i][1],b:ps[j][0],bn:ps[j][1]})}
 else{let n=2;while(n<ps.length)n*=2;const arr=[...ps].sort(()=>Math.random()-.5),sl=Array(n).fill(null);arr.forEach((p,i)=>{if(i<n/2)sl[i*2]=p;else sl[(i-n/2)*2+1]=p});let cur=[];
  for(let k=0;k<n;k+=2){const A=sl[k],B=sl[k+1];cur.push(mk(B?{a:A[0],an:A[1],b:B[0],bn:B[1]}:{a:A[0],an:A[1],b:'BYE',bn:'—',w:A[0],st:'done',wa:2}))}
  while(cur.length>1){rounds++;const nx=[];for(let k=0;k<cur.length;k+=2)nx.push(mk({r:rounds,sa:cur[k],sb:cur[k+1]}));cur=nx}}
 b.update(D.doc('tourneys/'+id),{status:'running',rounds});await b.commit();trn()}
async function tend0(id){const t=(await D.doc('tourneys/'+id).get()).data(),ms=(await D.collection('matches').where('t','==',id).get()).docs.map(d=>({id:d.id,...d.data()}));if(ms.some(m=>!m.w))return alert('لسه في مباريات ماخلصتش');let order=[];
 if(t.type=='league'){const P={};Object.keys(t.players||{}).forEach(k=>P[k]=0);ms.forEach(m=>{if(m.w=='tie'){P[m.a]++;P[m.b]++}else if(P[m.w]!=null)P[m.w]+=3});order=Object.entries(P).sort((x,y)=>y[1]-x[1]).slice(0,3).map(x=>x[0])}
 else{const top=Math.max(...ms.map(m=>m.r)),fin=ms.find(m=>m.r==top),lose=m=>m.w==m.a?m.b:m.a;order=[fin.w,lose(fin),...ms.filter(m=>m.r==top-1&&m.b!='BYE'&&m.a!='BYE').map(lose)]}
 const pr=t.prizes||[0,0,0],b=D.batch();order.forEach((u,i)=>{const amt=pr[Math.min(i,2)];if(!u||u=='BYE'||!(amt>0))return;b.update(D.doc('users/'+u),{coins:F.increment(amt)});b.set(D.collection('ledger').doc(),{u,type:'prize',amt,t:Date.now(),note:'جائزة '+t.name,by:me.uid})});
 b.update(D.doc('tourneys/'+id),{status:'done',winners:order,year:new Date().getFullYear(),wn:(t.players||{})[order[0]]||''});await b.commit();trn()}
async function tdel0(id){if(!confirm('حذف المسابقة ومبارياتها؟'))return;const s=await D.collection('matches').where('t','==',id).get(),b=D.batch();s.docs.forEach(d=>b.delete(d.ref));b.delete(D.doc('tourneys/'+id));await b.commit();trn()}

function preview(x){const k=Object.keys(x.players||{}).length,names=Object.values(x.players||{}).map(E).join('، ')||'—';let h=`<small class="m">المسجلين ${k}/${x.max||(x.type=='cup'?16:20)}: ${names}</small>`;
 if(x.type=='cup'){let n=2;while(n<Math.max(k,2))n*=2;h='<small class="m">خريطة الكأس (بتتحدد أسماؤها لما المسابقة تبدأ)</small>'+(()=>{let o='';for(let m=n;m>=2;m/=2)o+=`<div class="u"><span>${m==2?'النهائي':m==4?'نصف النهائي':m==8?'ربع النهائي':'الدور '+m}</span><b>${m/2} مباراة</b></div>`;return o})()+h}return h}

const sf=f=>async(...x)=>{try{await f(...x)}catch(e){alert('خطأ: '+e.message)}};
const tstart=sf(tstart0),tend=sf(tend0),tdel=sf(tdel0);
async function repair(){const q=await D.collection('matches').where('st','==','swap').get();for(const d of q.docs){const m={id:d.id,...d.data()};if(m.w)continue;const t=(await D.doc('tourneys/'+m.t).get()).data();if(!t)continue;
 if(t.type=='league'){await d.ref.update({w:'tie',st:'done'});continue}
 const sib=(await D.collection('matches').where('t','==',m.t).get()).docs.map(x=>({id:x.id,...x.data()})),o=sib.find(x=>x.id!=m.id&&x.r==m.r&&!x.w&&x.a&&x.b&&x.b!='BYE'&&x.st!='swap')||sib.find(x=>x.id!=m.id&&x.r==m.r&&!x.w&&x.a&&x.b&&x.b!='BYE');
 if(!o){const w=Math.random()<.5?m.a:m.b;await d.ref.update({w,st:'done',[w==m.a?'wa':'wb']:2});continue}
 const b=D.batch(),rs={board:'---------',turn:'a',g:1,wa:0,wb:0,dr:0,st:'play',pa:0,pb:0};b.update(d.ref,{...rs,b:o.b,bn:o.bn});b.update(D.doc('matches/'+o.id),{...rs,b:m.b,bn:m.bn});await b.commit()}}
async function delAcc(id){const u=us.find(x=>x.id==id);if(!u)return;if(id==me.uid)return alert('ماينفعش تحذف حساب الإدارة');if(!confirm('حذف '+u.name+' نهائيًا؟ مش هيرجع تاني، وعملاته هتروح للإدارة.'))return;
 try{const qs=await Promise.all(['votes','giftlog','ledger','msgs'].map(c=>D.collection(c).where('u','==',id).get()).concat([D.collection('follows').where('a','==',id).get(),D.collection('follows').where('b','==',id).get()])),all=qs.flatMap(q=>q.docs.map(d=>d.ref));
 for(let i=0;i<all.length;i+=400){const c=D.batch();all.slice(i,i+400).forEach(r=>c.delete(r));await c.commit()}
 const f=D.batch();f.delete(D.doc('users/'+id));f.set(D.doc('deleted/'+id),{t:Date.now(),name:u.name});if((u.coins||0)>0)f.set(D.doc('config/stats'),{profit:F.increment(u.coins)},{merge:true});await f.commit();alert('✓ تم الحذف نهائيًا');await load();tab('acc')}catch(e){alert('خطأ: '+e.message)}}
const av2=u=>u.photo&&u.photo.startsWith('data:image/')?`<img src="${u.photo}" style="width:38px;height:38px;border-radius:50%;object-fit:cover">`:`<span style="width:38px;height:38px;border-radius:50%;background:var(--l);display:inline-flex;align-items:center;justify-content:center">${E((u.name||'?')[0])}</span>`;

async function aepub(){const ks=[...document.querySelectorAll('.ak:checked')].map(c=>us.find(u=>u.id==c.value)),t=$('#at').value.trim();if(ks.length<2||!t)return $('#er').textContent='اكتب العنوان واختر حسابين على الأقل';
 const o=ks.map(u=>({t:'account',x:u.name,url:'',acc:u.id,photo:(u.photo||'').slice(0,40000)})),v={};o.forEach((_,i)=>v[i]=0);const s=Date.now(),e=s+(+$('#aD').value||1)*dur[$('#aU').value];
 try{await D.collection('polls').add({title:t,o,v,n:0,start:s,end:e,created:s,code:rc(),owner:me.uid,ownerName:'الإدارة',ownerFollowers:100,prize:+$('#aP').value||0});tab('pol')}catch(x){$('#er').textContent=x.message}}
