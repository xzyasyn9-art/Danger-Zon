<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1424;--c:#18213a;--l:#2c3a63;--t:#f4f1e8;--m:#9aa5d1;--a:#f2b134}
*{box-sizing:border-box;margin:0;font-family:Cairo,system-ui,sans-serif}
body{background:var(--bg);color:var(--t);min-height:100dvh}
input,select,textarea,button{font:inherit;color:inherit;background:var(--c);border:1px solid var(--l);border-radius:12px;padding:11px;width:100%}
button{background:var(--a);color:#0e1424;border:0;font-weight:900;cursor:pointer}button.s{background:var(--c);color:var(--t);border:1px solid var(--l);font-weight:400}
.p{padding:16px;display:flex;flex-direction:column;gap:10px;max-width:640px;margin:auto}
.tabs{display:flex;gap:4px;position:sticky;top:0;background:var(--bg);padding:8px;z-index:3;overflow-x:auto}
.tabs button{width:auto;white-space:nowrap;background:var(--c);color:var(--m);font-weight:400;padding:8px 14px}.tabs button.on{background:var(--a);color:#0e1424;font-weight:900}
.u{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--c);padding:10px 12px;border-radius:12px}
.u button{width:auto;padding:6px 14px}.m{color:var(--m);font-size:13px}
.k{display:grid;grid-template-columns:1fr 1fr;gap:8px}.k div{background:var(--c);border-radius:12px;padding:14px;font-size:13px;color:var(--m)}.k b{display:block;font-size:26px;color:var(--t)}
.row{display:flex;gap:8px}.row>*{flex:1}.o{display:flex;flex-direction:column;gap:6px}
</style></head><body><div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const CFG={apiKey:"AIzaSyBghKRFcPzwg2I_n6OVZV4w7GVA3WF48jc",authDomain:"vote-app-c9647.firebaseapp.com",projectId:"vote-app-c9647",appId:"1:1091416401804:web:644298593f78fa856558a9"};
firebase.initializeApp(CFG);
const A=firebase.auth(),D=firebase.firestore(),$=s=>document.querySelector(s),E=s=>(s+'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const em=n=>[...new TextEncoder().encode(n.trim().toLowerCase())].map(b=>b.toString(16).padStart(2,'0')).join('')+'@vote.app';
const rc=()=>String(Math.floor(Math.random()*9e10)+1e10),dur={m:6e4,h:36e5,d:864e5,w:6048e5};
const TY={text:'نص فقط',account:'حساب',image:'صورة',gif:'صورة متحركة',video:'فيديو',audio:'تسجيل صوتي'};
const ft=s=>{s=s||0;const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+' س '+m+' د':m+' د'};
let me,us=[],pl=[];
function login(msg){$('#app').innerHTML=`<div class="p" style="min-height:100dvh;justify-content:center"><h1>دخول الإدارة</h1><input id="n" placeholder="اسم الإدارة"><input id="k" type="password" placeholder="الرمز"><button onclick="go()">دخول</button><button class="s" onclick="setup()">أول مرة؟ أنشئ حساب الإدارة (مرة واحدة فقط)</button><p class="m" id="er">${msg||''}</p></div>`}
async function go(){try{await A.signInWithEmailAndPassword(em($('#n').value),$('#k').value)}catch(e){$('#er').textContent='الاسم أو الرمز غلط'}}
A.onAuthStateChanged(async u=>{if(window._setup)return;if(!u)return login();let ok=0;try{ok=(await D.doc('admins/'+u.uid).get()).exists}catch(e){}
 if(!ok){await A.signOut();return login('هذا الحساب ليس حساب إدارة')}
 me=u;$('#app').innerHTML=`<div class="tabs">${[['sum','الملخص'],['acc','الحسابات'],['new','انتخاب جديد'],['pol','الانتخابات'],['msg','الرسائل']].map(t=>`<button id="t-${t[0]}" onclick="tab('${t[0]}')">${t[1]}</button>`).join('')}<button class="s" onclick="A.signOut()">خروج</button></div><div class="p" id="v"></div>`;tab('sum')});
async function load(){const[a,b]=await Promise.all([D.collection('users').get(),D.collection('polls').orderBy('created','desc').get()]);us=a.docs.map(d=>({id:d.id,...d.data()}));pl=b.docs.map(d=>({id:d.id,...d.data()}))}
async function tab(t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.id=='t-'+t));$('#v').innerHTML='<p class="m">جاري التحميل...</p>';await load();await settle().catch(e=>console.log(e));({sum,acc,new:nw,pol,msg})[t]()}
function sum(){const v=pl.reduce((a,p)=>a+(p.n||0),0),t=us.reduce((a,u)=>a+(u.secs||0),0);$('#v').innerHTML=`<div class="k"><div><b>${us.length}</b>حساب</div><div><b>${pl.length}</b>انتخاب</div><div><b>${v}</b>إجمالي الأصوات</div><div><b>${ft(t)}</b>إجمالي وقت الاستخدام</div></div>`}
function acc(){$('#v').innerHTML=`<select id="lm" onchange="lst()"><option>10</option><option>50</option><option>100</option><option value="9999">الكل</option></select><select id="so" onchange="lst()"><option value="secs">الأكثر وقتًا في التطبيق</option><option value="votes">الأكثر تصويتًا</option><option value="followers">الأكثر متابعين</option></select><div id="ul"></div>`;lst()}
function lst(){const k=+$('#lm').value,f=$('#so').value;$('#ul').innerHTML=[...us].sort((a,b)=>(b[f]||0)-(a[f]||0)).slice(0,k).map((u,i)=>`<div class="u"><span><b>${i+1}. ${E(u.name)}</b><br><small class="m">كود ${u.code} • ${u.followers||0} متابع</small></span><span class="m">${ft(u.secs)}<br>${u.votes||0} تصويت</span></div>`).join('')}
function nw(){$('#v').innerHTML=`<datalist id="acs">${us.map(u=>`<option value="${E(u.name)}">`).join('')}</datalist><h2>انتخاب جديد</h2><input id="ti" placeholder="سؤال الانتخاب"><div id="ops"></div><button class="s" onclick="addOpt()">+ إضافة خيار</button><button class="s" onclick="pickAccs()">+ اختيار حسابات تتنافس</button><div class="row"><input id="du" type="number" min="1" value="1"><select id="un"><option value="m">دقيقة</option><option value="h" selected>ساعة</option><option value="d">يوم</option><option value="w">أسبوع</option></select></div><label class="m">يبدأ بعد كام دقيقة (0 = فورًا)</label><input id="st" type="number" min="0" value="0"><button onclick="pub()">نشر الانتخاب</button><p id="er" class="m"></p>`;addOpt();addOpt()}
function addOpt(){const d=document.createElement('div');d.className='o';d.innerHTML=`<div class="row"><select class="ty">${Object.entries(TY).map(e=>`<option value="${e[0]}">${e[1]}</option>`).join('')}</select><input class="tx" list="acs" placeholder="النص أو اسم الحساب"></div><input class="ur" placeholder="رابط الوسائط https://... (للصورة/فيديو/صوت)">`;$('#ops').append(d)}
async function pub(){const o=[...document.querySelectorAll('#ops .o')].map(d=>({t:d.querySelector('.ty').value,x:d.querySelector('.tx').value.trim(),url:d.querySelector('.ur').value.trim(),acc:d.dataset.acc||(us.find(u=>u.name==d.querySelector('.tx').value.trim())||{}).id||''}));const t=$('#ti').value.trim();
 if(!t||o.length<2||o.some(x=>!x.x&&!x.url))return $('#er').textContent='اكتب السؤال وخيارين على الأقل.';
 const s=Date.now()+(+$('#st').value||0)*6e4,e=s+(+$('#du').value||1)*dur[$('#un').value],v={};o.forEach((_,i)=>v[i]=0);
 try{await D.collection('polls').add({title:t,o,v,n:0,start:s,end:e,created:Date.now(),code:rc(),owner:me.uid,ownerName:'الإدارة',ownerFollowers:100});$('#er').textContent='✓ تم النشر';tab('pol')}catch(x){$('#er').textContent=x.message}}
function pol(){$('#v').innerHTML=pl.map(p=>{const now=Date.now(),st=now<p.start?'قريبًا':now>=p.end?'انتهى':'مباشر';return `<div class="u"><span><b>${E(p.title)}</b><br><small class="m">${st} • ${p.n||0} صوت • كود ${p.code}</small></span><span style="display:flex;gap:6px">${st=='مباشر'?`<button class="s" onclick="endNow('${p.id}')">إنهاء</button>`:''}<button class="s" onclick="del('${p.id}')">حذف</button></span></div>`}).join('')||'<p class="m">مفيش انتخابات.</p>'}
async function endNow(id){await D.doc('polls/'+id).update({end:Date.now()});tab('pol')}
async function del(id){if(confirm('حذف الانتخاب؟')){await D.doc('polls/'+id).delete();tab('pol')}}
async function msg(){const s=await D.collection('msgs').orderBy('t','desc').limit(100).get();$('#v').innerHTML=s.docs.map(d=>{const m=d.data();return `<div class="u" style="flex-direction:column;align-items:stretch"><span><b>${E(m.name)}</b> <small class="m">${new Date(m.t).toLocaleString('ar-EG')}</small><br>${E(m.text)}</span>${m.reply?`<span class="m" style="color:var(--a)">ردّك: ${E(m.reply)}</span>`:''}<div class="row"><input id="r-${d.id}" placeholder="اكتب الرد"><button onclick="rep('${d.id}')">رد</button><button class="s" onclick="dm('${d.id}')">حذف</button></div></div>`}).join('')||'<p class="m">مفيش رسائل.</p>'}
async function rep(id){const t=$('#r-'+id).value.trim();if(!t)return;await D.doc('msgs/'+id).update({reply:t,read:true});msg()}
async function dm(id){await D.doc('msgs/'+id).delete();msg()}
async function setup(){const n=$('#n').value.trim(),k=$('#k').value;if(!n||k.length<6)return $('#er').textContent='اكتب اسمًا ورمزًا من 6 أحرف على الأقل';
 window._setup=1;let c;try{c=await A.createUserWithEmailAndPassword(em(n),k)}catch(e){window._setup=0;return $('#er').textContent=e.code=='auth/email-already-in-use'?'الاسم ده مستخدم، اختار اسم تاني':e.message}
 const u=c.user.uid,b=D.batch();b.set(D.doc('users/'+u),{name:n,code:rc(),followers:0,votes:0,secs:0});b.set(D.doc('admins/'+u),{ok:true});b.set(D.doc('config/locked'),{by:u});
 try{await b.commit();window._setup=0;location.reload()}catch(e){try{await c.user.delete()}catch(x){}window._setup=0;login('تم إنشاء حساب إدارة قبل كده، أو تعذر الإنشاء: '+e.message)}}

const F=firebase.firestore.FieldValue,nf=n=>(n||0).toLocaleString('ar-EG');
const GE='🌹وردة,🌷توليب,🌼زهرة,🍀برسيم,🍬حلوى,🍭مصاصة,🍪كوكيز,🍩دونات,🍫شوكولاتة,🍦آيس كريم,☕قهوة,🍕بيتزا,🍔برجر,🎈بالون,🎀فيونكة,⭐نجمة,💌رسالة,🧸دبدوب,🎵نغمة,🎶لحن,🐱قطة,🐶كلب,🐰أرنب,🦊ثعلب,🐼باندا,🐨كوالا,🐯نمر صغير,🐴حصان,🦄يونيكورن,🐬دلفين,🦋فراشة,🦜ببغاء,🐢سلحفاة,🐘فيل,🦒زرافة,🐧بطريق,🦉بومة,🐻دب,🐺ذئب,🦅نسر,💖قلب,💝قلب هدية,💎ألماسة,💍خاتم,👑تاج,🏆كأس,🥇ميدالية,🎖وسام,🚗سيارة,🏎سيارة سباق,🚁هليكوبتر,✈طائرة,🚀صاروخ,🛥يخت,🏰قلعة,🌋بركان,🌈قوس قزح,🌙هلال,☀شمس,🌍كوكب,🦁أسد,🐉تنين,🦈قرش,🐅نمر,🐆فهد,🐊تمساح,🦏وحيد القرن,🐎حصان أصيل,🔥نار,⚡برق,🌪إعصار,🌊موجة,❄جليد,🗡سيف,🛡درع,🏹قوس,🔱رمح,🪄عصا سحرية,🧿عين,💰كنز,🪙عملة ذهب,🏅ميدالية ذهبية,🎆ألعاب نارية,🎇شرارات,🌠شهاب,🛸طبق طائر,🛰قمر صناعي,🗽تمثال,🕌مسجد,🏯قصر,🗼برج,🏝جزيرة,🌌مجرة,🪐زحل,☄مذنب,🔮كرة سحرية,📿سبحة,🎭قناع,🎡عجلة,🪁طائرة ورقية'.split(',');
async function seed(){const b=D.batch();GE.slice(0,100).forEach((x,i)=>{const e=[...x][0]==='\u200d'?x:String.fromCodePoint(x.codePointAt(0)),n=x.slice(e.length);b.set(D.doc('gifts/g'+String(i).padStart(3,'0')),{e,n,price:Math.max(5,Math.round(10*Math.pow(1.095,i)/5)*5),pts:1+Math.floor(i/12),o:i})});await b.commit();alert('✓ تم تحميل الهدايا');tab('sum')}
async function sum(){const v=pl.reduce((x,p)=>x+(p.n||0),0),t=us.reduce((x,u)=>x+(u.secs||0),0),c=us.reduce((x,u)=>x+(u.coins||0),0),st=await D.doc('config/stats').get(),gs=await D.collection('gifts').get();
 $('#v').innerHTML=`<div class="k"><div><b>${us.length}</b>حساب</div><div><b>${pl.length}</b>انتخاب</div><div><b>${v}</b>إجمالي الأصوات</div><div><b>${ft(t)}</b>وقت الاستخدام</div><div><b>🪙 ${nf(c)}</b>عملات عند الحسابات</div><div><b>🪙 ${nf(st.exists?st.data().profit:0)}</b>مكسب الإدارة</div></div><button class="s" onclick="seed()">${gs.size?'إعادة تحميل الهدايا':'تحميل الهدايا (100)'} — الحالي ${gs.size}</button>`}
function acc(){$('#v').innerHTML=`<div class="u" style="flex-direction:column;align-items:stretch;gap:6px"><b>إضافة عملات بالكود</b><div class="row"><input id="cc" inputmode="numeric" maxlength="11" placeholder="كود الحساب (11 رقم)"><input id="cm" type="number" min="1" placeholder="المبلغ"></div><button onclick="byCode()">إضافة</button><p id="er" class="m"></p></div><select id="lm" onchange="lst()"><option>10</option><option>50</option><option>100</option><option value="9999">الكل</option></select><select id="so" onchange="lst()"><option value="secs">الأكثر وقتًا في التطبيق</option><option value="coins">الأكثر عملات</option><option value="votes">الأكثر تصويتًا</option><option value="followers">الأكثر متابعين</option></select><div id="ul"></div>`;lst()}
function lst(){const k=+$('#lm').value,f=$('#so').value;$('#ul').innerHTML=[...us].sort((x,y)=>(y[f]||0)-(x[f]||0)).slice(0,k).map((u,i)=>`<div class="u" onclick="acd('${u.id}')" style="cursor:pointer"><span><b>${i+1}. ${E(u.name)}</b>${u.banned?' 🚫':''}${u.warn?' ⚠':''}<br><small class="m">كود ${u.code} • ${u.followers||0} متابع</small></span><span class="m">🪙 ${nf(u.coins)}<br>${ft(u.secs)}</span></div>`).join('')}
function byCode(){const u=us.find(x=>x.code==$('#cc').value.trim()),n=Math.floor(+$('#cm').value);if(!u||!(n>0))return $('#er').textContent='كود غلط أو مبلغ غلط';coin(u.id,1,n,'')}
async function coin(id,sg,n,note){n=Math.floor(n);if(!(n>0))return;const b=D.batch();b.update(D.doc('users/'+id),{coins:F.increment(sg*n)});b.set(D.collection('ledger').doc(),{u:id,type:sg>0?'add':'take',amt:sg*n,by:me.uid,t:Date.now(),note:note||''});await b.commit();await load();acd(id)}
async function warn(id,on){await D.doc('users/'+id).update({warn:on?$('#wt').value.trim():''});await load();acd(id)}
async function ban(id,on){await D.doc('users/'+id).update({banned:!!on});await load();acd(id)}
async function acd(id){const u=us.find(x=>x.id==id);$('#v').innerHTML='<p class="m">جاري التحميل...</p>';
 const[l,g,vt]=await Promise.all([D.collection('ledger').where('u','==',id).get(),D.collection('giftlog').where('u','==',id).get(),D.collection('votes').where('u','==',id).get()]);
 const L=l.docs.map(d=>d.data()),G=g.docs.map(d=>d.data()),exp=L.reduce((x,y)=>x+y.amt,0)-G.reduce((x,y)=>x+y.price,0),bad=exp!=(u.coins||0);
 const T={add:'إضافة من الإدارة',take:'سحب من الإدارة',refund:'استرجاع هدية'},ev=[...L.map(x=>({t:x.t,s:`${x.amt>0?'+':''}${nf(x.amt)} ${T[x.type]||x.type} ${E(x.note||'')}`})),...G.map(x=>({t:x.t,s:`-${nf(x.price)} هدية ${E(x.gn)} على خيار ${+x.opt+1} في «${E(x.pt)}»${x.res?(x.res=='lose'?' (خسرت)':' (استُرجعت)'):''}`}))].sort((x,y)=>y.t-x.t);
 const vh=vt.docs.map(d=>d.data()).sort((x,y)=>(y.t||0)-(x.t||0)).slice(0,20).map(x=>{const p=pl.find(q=>q.id==x.p);return p?`<div class="u"><span>${E(p.title)}</span><b>${E((p.o[x.c]||{}).x||'')}</b></div>`:''}).join('')||'<p class="m">لا يوجد</p>';
 $('#v').innerHTML=`<button class="s" onclick="tab('acc')">← رجوع</button><h2>${E(u.name)} ${u.banned?'🚫':''}</h2><div class="u"><span>الرصيد الحالي</span><b>🪙 ${nf(u.coins)}</b></div>${bad?`<div class="u" style="border:1px solid #ff8a80"><span>⚠ الرصيد لا يطابق السجل (المتوقع ${nf(exp)}). احتمال اختراق.</span></div>`:'<p class="m">✓ الرصيد يطابق السجل</p>'}
<div class="row"><input id="ca" type="number" min="1" placeholder="المبلغ"><input id="cn" placeholder="ملاحظة"></div><div class="row"><button onclick="coin('${id}',1,+$('#ca').value,$('#cn').value)">+ إضافة</button><button class="s" onclick="coin('${id}',-1,+$('#ca').value,$('#cn').value)">− سحب</button></div>
<h3>تحذير / إيقاف</h3><textarea id="wt" rows="2">${E(u.warn||'تم رصد نشاط مخالف على حسابك. استمراره سيؤدي إلى إيقاف الحساب.')}</textarea><div class="row"><button onclick="warn('${id}',1)">إرسال تحذير</button><button class="s" onclick="warn('${id}',0)">إزالة التحذير</button></div><button class="s" onclick="ban('${id}',${u.banned?0:1})">${u.banned?'رفع الإيقاف':'إيقاف الحساب'}</button>
<h3>سجل العملات والهدايا</h3>${ev.map(x=>`<div class="u"><span>${x.s}<br><small class="m">${new Date(x.t).toLocaleString('ar-EG')}</small></span></div>`).join('')||'<p class="m">لا يوجد</p>'}<h3>صوّت على</h3>${vh}<h3>المسابقات</h3><p class="m">قريبًا (الدفعة الجاية)</p>`}
async function settle(){const now=Date.now();for(const p of pl){if(p.end>now||p.settled)continue;const gs=await D.collection('giftlog').where('poll','==',p.id).get(),open=gs.docs.filter(d=>!d.data().res);
 const vs=p.o.map((_,i)=>((p.v||{})[i]||0)+((p.g||{})[i]||0)),mx=Math.max(...vs),win=vs.filter(x=>x==mx).length==1?String(vs.indexOf(mx)):null;let profit=0;const b=D.batch();
 open.slice(0,140).forEach(d=>{const x=d.data(),ok=win===null||x.opt==win;b.update(d.ref,{res:ok?'refund':'lose'});if(ok){b.update(D.doc('users/'+x.u),{coins:F.increment(x.price)});b.set(D.collection('ledger').doc(),{u:x.u,type:'refund',amt:x.price,t:Date.now(),note:'استرجاع هدية: '+x.pt,by:me.uid})}else profit+=x.price});
 if(profit)b.set(D.doc('config/stats'),{profit:F.increment(profit)},{merge:true});if(open.length<=140)b.update(D.doc('polls/'+p.id),{settled:true});await b.commit()}}
function pickAccs(){const d=document.createElement('div');d.className='u';d.style.cssText='flex-direction:column;align-items:stretch';d.innerHTML='<b>اختر الحسابات</b>'+us.map(u=>`<label><input type="checkbox" class="pk" value="${u.id}" style="width:auto"> ${E(u.name)}</label>`).join('')+'<button onclick="addPk(this)">أضفهم كخيارات</button>';$('#ops').after(d)}
function addPk(b){document.querySelectorAll('#ops .o').forEach(r=>{if(!r.querySelector('.tx').value&&!r.querySelector('.ur').value)r.remove()});document.querySelectorAll('.pk:checked').forEach(c=>{const u=us.find(x=>x.id==c.value);addOpt();const r=[...document.querySelectorAll('#ops .o')].pop();r.querySelector('.ty').value='account';r.querySelector('.tx').value=u.name;r.dataset.acc=u.id});b.parentElement.remove()}
</script></body></html>
