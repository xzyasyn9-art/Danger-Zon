<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تطبيق تصويتي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#111936;--c:#1b2550;--l:#2c3870;--t:#f4f1e8;--m:#9aa5d1;--a:#f2b134}
*{box-sizing:border-box;margin:0;font-family:Cairo,system-ui,sans-serif}
body{background:var(--bg);color:var(--t);height:100dvh;overflow:hidden}
input,select,textarea,button{font:inherit;color:inherit;background:var(--c);border:1px solid var(--l);border-radius:12px;padding:11px;width:100%}
button{background:var(--a);color:#111936;border:0;font-weight:900;cursor:pointer}
button.s{background:var(--c);color:var(--t);border:1px solid var(--l);font-weight:400}
button:focus-visible,input:focus-visible{outline:2px solid var(--a)}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
main{flex:1;overflow:auto;position:relative}
nav{display:flex;background:var(--c);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;color:var(--m);border-radius:0;font-size:13px;padding:10px 2px;font-weight:400}
nav button.on{color:var(--a);font-weight:900}
.p{padding:16px;display:flex;flex-direction:column;gap:10px;max-width:560px;margin:auto}
#feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory}
.card{min-height:100%;scroll-snap-align:start;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:560px;margin:auto;justify-content:center}
.card h2{font-size:26px;font-weight:900;line-height:1.35}
.m{color:var(--m);font-size:13px}.m b{color:var(--a);cursor:pointer}
.o{display:flex;flex-direction:column;gap:6px}
.o img,.o video{width:100%;max-height:30vh;object-fit:cover;border-radius:12px}.o audio{width:100%}
.v{position:relative;overflow:hidden;display:flex;justify-content:space-between;background:var(--c);color:var(--t);border:1px solid var(--l);font-weight:700}
.v i{position:absolute;inset:0 0 0 auto;background:#f2b13440;width:0;transition:width .5s}
.v span{position:relative}
.v.my{border-color:var(--a)}
.row{display:flex;gap:8px}.row>*{flex:1}
.u{display:flex;justify-content:space-between;align-items:center;background:var(--c);padding:10px 12px;border-radius:12px}
.u button{width:auto;padding:6px 14px}
#au{position:absolute;left:12px;top:12px;width:auto;padding:6px 12px;font-size:13px;z-index:2}
</style></head><body>
<div id="app"><main id="main"></main><nav id="nav" hidden></nav></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== 1) الصق إعدادات Firebase هنا =====
const CFG={apiKey:"",authDomain:"",projectId:"",appId:""};
// =========================================
authUI();firebase.initializeApp(CFG);
const A=firebase.auth(),D=firebase.firestore(),F=firebase.firestore.FieldValue,$=s=>document.querySelector(s);
const E=s=>(s+'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const U=u=>/^https?:\/\//.test(u||'')?E(u):'';
const em=n=>[...new TextEncoder().encode(n.trim().toLowerCase())].map(b=>b.toString(16).padStart(2,'0')).join('')+'@vote.app';
const rc=()=>String(Math.floor(Math.random()*9e10)+1e10);
let me,isAdmin=0,polls=[],mine={},follows=new Set(),tab='feed',key='',auto=null,unsubs=[];
const TY={text:'نص فقط',image:'صورة',gif:'صورة متحركة',video:'فيديو',audio:'تسجيل صوتي'};
const dur={m:6e4,h:36e5,d:864e5,w:6048e5};

// ---------- الدخول ----------
function authUI(){$('#nav').hidden=true;$('#main').innerHTML=`<div class="p" style="min-height:100%;justify-content:center">
<h1 style="font-size:34px;font-weight:900">تطبيق تصويتي</h1><p class="m">صوّت، وتابع أصحابك، وشوف النتيجة لحظة بلحظة.</p>
<input id="n" placeholder="الاسم" autocomplete="username"><input id="k" type="password" placeholder="الرمز (6 أحرف أو أرقام على الأقل)" autocomplete="current-password">
<div class="row"><button onclick="login()">عندي حساب قديم</button><button class="s" onclick="signup()">اعمل حساب</button></div>
<button class="s" onclick="google()">الدخول بجوجل</button><p id="er" class="m" style="color:#ff8a80"></p></div>`}
const er=e=>$('#er').textContent=({'auth/invalid-credential':'الاسم أو الرمز غلط','auth/email-already-in-use':'الاسم ده مستخدم، اختار اسم تاني','auth/weak-password':'الرمز لازم يكون 6 على الأقل','auth/invalid-email':'الاسم غير صالح'})[e.code]||e.message;
async function login(){try{await A.signInWithEmailAndPassword(em($('#n').value),$('#k').value)}catch(e){er(e)}}
async function signup(){const n=$('#n').value.trim();if(!n)return er({message:'اكتب الاسم'});try{window._nm=n;await A.createUserWithEmailAndPassword(em(n),$('#k').value)}catch(e){er(e)}}
async function google(){try{await A.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){er(e)}}

A.onAuthStateChanged(async u=>{unsubs.forEach(f=>f());unsubs=[];if(!u){me=null;return authUI()}
 let r=await D.doc('users/'+u.uid).get();
 if(!r.exists){await D.doc('users/'+u.uid).set({name:window._nm||u.displayName||'مستخدم',code:rc(),followers:0,votes:0});r=await D.doc('users/'+u.uid).get()}
 me={id:u.uid,...r.data()};
 try{isAdmin=(await D.doc('admins/'+u.uid).get()).exists?1:0}catch(e){isAdmin=0}
 unsubs.push(D.collection('polls').orderBy('created','desc').limit(60).onSnapshot(s=>{polls=s.docs.map(d=>({id:d.id,...d.data()}));rank();const k=polls.map(p=>p.id).join();if(tab=='feed'){k==key?patchAll():drawFeed()}key=k}));
 unsubs.push(D.collection('votes').where('u','==',u.uid).onSnapshot(s=>{mine={};s.docs.forEach(d=>mine[d.data().p]=d.data().c);if(tab=='feed')drawFeed()}));
 unsubs.push(D.collection('follows').where('a','==',u.uid).onSnapshot(s=>{follows=new Set(s.docs.map(d=>d.data().b))}));
 unsubs.push(D.doc('users/'+u.uid).onSnapshot(d=>{if(d.exists)me={id:u.uid,...d.data()}}));
 nav();go('feed')});

function nav(){const t=[['feed','🗳 الانتخابات'],['search','🔍 بحث'],['new','➕ جديد'],['me','👤 حسابي']];if(isAdmin)t.push(['adm','⚙ الإدارة']);
 $('#nav').hidden=false;$('#nav').innerHTML=t.map(x=>`<button id="t-${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(t){tab=t;clearInterval(auto);auto=null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id=='t-'+t));
 ({feed:drawFeed,search:drawSearch,new:drawNew,me:drawMe,adm:drawAdm})[t]()}

// ---------- ترتيب: المتابعين يرفعون ظهور الانتخاب ----------
function rank(){const now=Date.now(),sc=p=>Math.log(1+(p.ownerFollowers||0))*3-(now-p.created)/36e5/6+(now<p.end?4:0);
 polls=polls.filter(p=>Date.now()>=p.start||p.owner==me.id).sort((a,b)=>sc(b)-sc(a))}

// ---------- الفيد ----------
const media=o=>{const u=U(o.url);return !u?'':o.t=='video'?`<video src="${u}" controls playsinline></video>`:o.t=='audio'?`<audio src="${u}" controls></audio>`:`<img src="${u}" loading="lazy" alt="">`};
const card=p=>`<section class="card" id="c-${p.id}"><div class="m"><b onclick="openUser('${p.owner}')">@${E(p.ownerName)}</b> • كود الانتخاب ${p.code} • <span id="t-${p.id}"></span></div><h2>${E(p.title)}</h2>`+
 p.o.map((o,i)=>`<div class="o">${media(o)}<button class="v ${mine[p.id]==i?'my':''}" onclick="vote('${p.id}',${i})"><i id="b-${p.id}-${i}"></i><span>${E(o.x||'خيار '+(i+1))}${mine[p.id]==i?' ✓':''}</span><span id="p-${p.id}-${i}"></span></button></div>`).join('')+
 `<div class="m" id="n-${p.id}"></div><button class="s" onclick="share('${p.id}')">📷 صورة النتيجة</button></section>`;
function drawFeed(){const m=$('#main'),old=$('#feed')?.scrollTop||0;
 m.innerHTML=`<button id="au" class="s" onclick="toggleAuto()">${auto?'⏸ تلقائي':'▶ كل 15 ثانية'}</button><div id="feed">`+(polls.length?polls.map(card).join(''):'<div class="p"><p class="m">لسه مفيش انتخابات. اعمل أول واحد من تبويب "جديد".</p></div>')+'</div>';
 $('#feed').scrollTop=old;patchAll()}
function patchAll(){const now=Date.now();polls.forEach(p=>{const show=now>=p.end||mine[p.id]!=null,n=p.n||0;
 p.o.forEach((o,i)=>{const v=(p.v||{})[i]||0,pc=n?Math.round(v/n*100):0,b=$('#b-'+p.id+'-'+i),x=$('#p-'+p.id+'-'+i);if(b){b.style.width=show?pc+'%':'0';x.textContent=show?pc+'% ('+v+')':''}});
 const nn=$('#n-'+p.id);if(nn)nn.textContent=show?'إجمالي الأصوات: '+n:'صوّت عشان تشوف النتيجة'});tick()}
function tick(){const now=Date.now();polls.forEach(p=>{const e=$('#t-'+p.id);if(!e)return;const r=p.end-now;
 e.textContent=r<=0?'انتهى':'باقي '+(r>864e5?Math.floor(r/864e5)+' يوم':r>36e5?Math.floor(r/36e5)+' ساعة':Math.floor(r/6e4)+':'+String(Math.floor(r/1e3)%60).padStart(2,'0'))})}
setInterval(()=>{if(tab=='feed')tick()},1000);
function toggleAuto(){if(auto){clearInterval(auto);auto=null}else auto=setInterval(()=>{const f=$('#feed');if(!f)return;f.scrollTo({top:f.scrollTop+f.clientHeight>=f.scrollHeight-5?0:f.scrollTop+f.clientHeight,behavior:'smooth'})},15000);$('#au').textContent=auto?'⏸ تلقائي':'▶ كل 15 ثانية'}
async function vote(id,i){const p=polls.find(x=>x.id==id);if(mine[id]!=null||Date.now()>=p.end||Date.now()<p.start)return;
 try{const b=D.batch();b.set(D.doc('votes/'+id+'_'+me.id),{p:id,u:me.id,c:i});b.update(D.doc('polls/'+id),{['v.'+i]:F.increment(1),n:F.increment(1)});b.update(D.doc('users/'+me.id),{votes:F.increment(1)});await b.commit()}catch(e){alert('تعذر التصويت: '+e.message)}}
function share(id){const p=polls.find(x=>x.id==id),c=document.createElement('canvas');c.width=1080;c.height=300+p.o.length*130;const g=c.getContext('2d');
 g.fillStyle='#111936';g.fillRect(0,0,1080,c.height);g.textAlign='center';g.fillStyle='#f4f1e8';g.font='bold 54px Cairo,sans-serif';g.fillText(p.title.slice(0,36),540,110);
 g.font='32px Cairo,sans-serif';g.fillStyle='#9aa5d1';g.fillText('كود الانتخاب '+p.code,540,170);
 p.o.forEach((o,i)=>{const pc=p.n?Math.round(((p.v||{})[i]||0)/p.n*100):0,y=230+i*130;g.fillStyle='#1b2550';g.fillRect(60,y,960,90);g.fillStyle='#f2b134';g.fillRect(1020-9.6*pc,y,9.6*pc,90);g.fillStyle='#f4f1e8';g.font='bold 36px Cairo,sans-serif';g.fillText((o.x||'خيار '+(i+1)).slice(0,24)+' — '+pc+'%',540,y+58)});
 c.toBlob(async b=>{const f=new File([b],'result.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))try{await navigator.share({files:[f]});return}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='result.png';a.click()})}

// ---------- بحث بالكود ----------
function drawSearch(){$('#main').innerHTML=`<div class="p"><input id="q" inputmode="numeric" maxlength="11" placeholder="اكتب كود من 11 رقم (انتخاب أو صفحة)"><button onclick="search()">ابحث</button><div id="res"></div></div>`}
async function search(){const q=$('#q').value.trim(),r=$('#res');r.innerHTML='...';
 const [a,b]=await Promise.all([D.collection('users').where('code','==',q).get(),D.collection('polls').where('code','==',q).get()]);
 let h='';a.docs.forEach(d=>{h+=userRow(d.id,d.data())});
 b.docs.forEach(d=>{const p={id:d.id,...d.data()};if(!polls.find(x=>x.id==p.id))polls.push(p);h+=card(p)});
 r.innerHTML=h||'<p class="m">مفيش نتيجة للكود ده.</p>';patchAll()}
const userRow=(id,u)=>`<div class="u"><span><b>${E(u.name)}</b><br><small class="m">${u.followers||0} متابع • كود ${u.code}</small></span>${id==me.id?'':`<button onclick="fol('${id}',this)">${follows.has(id)?'إلغاء المتابعة':'متابعة'}</button>`}</div>`;
async function fol(id,btn){const b=D.batch(),r=D.doc('follows/'+me.id+'_'+id),on=follows.has(id);
 on?b.delete(r):b.set(r,{a:me.id,b:id});b.update(D.doc('users/'+id),{followers:F.increment(on?-1:1)});
 try{await b.commit();on?follows.delete(id):follows.add(id);btn.textContent=on?'متابعة':'إلغاء المتابعة'}catch(e){alert(e.message)}}
async function openUser(id){tab='search';go('search');const d=await D.doc('users/'+id).get(),s=await D.collection('polls').where('owner','==',id).get();
 s.docs.forEach(x=>{if(!polls.find(p=>p.id==x.id))polls.push({id:x.id,...x.data()})});
 $('#res').innerHTML=userRow(id,d.data())+s.docs.map(x=>card({id:x.id,...x.data()})).join('');patchAll()}

// ---------- انتخاب جديد ----------
function drawNew(){$('#main').innerHTML=`<div class="p"><h2>انتخاب جديد</h2><input id="ti" placeholder="سؤال الانتخاب (مثلا: مصر ولا السعودية؟)"><div id="ops"></div>
<button class="s" onclick="addOpt()">+ إضافة خيار</button><div class="row"><input id="du" type="number" min="1" value="1"><select id="un"><option value="m">دقيقة</option><option value="h" selected>ساعة</option><option value="d">يوم</option><option value="w">أسبوع</option></select></div>
<label class="m">يبدأ بعد (اتركه 0 للبدء فورًا، بالدقائق)</label><input id="st" type="number" min="0" value="0"><button onclick="publish()">نشر الانتخاب</button><p id="er" class="m"></p></div>`;addOpt();addOpt()}
function addOpt(){const d=document.createElement('div');d.className='o';d.innerHTML=`<div class="row"><select class="ty">${Object.entries(TY).map(e=>`<option value="${e[0]}">${e[1]}</option>`).join('')}</select><input class="tx" placeholder="النص"></div><input class="ur" placeholder="رابط الوسائط (https://...) لو مش نص فقط">`;$('#ops').append(d)}
async function publish(){const o=[...document.querySelectorAll('#ops .o')].map(d=>({t:d.querySelector('.ty').value,x:d.querySelector('.tx').value.trim(),url:d.querySelector('.ur').value.trim()}));
 const t=$('#ti').value.trim();if(!t||o.length<2||o.some(x=>!x.x&&!x.url))return $('#er').textContent='اكتب السؤال وخيارين على الأقل، وكل خيار فيه نص أو رابط.';
 const s=Date.now()+(+$('#st').value||0)*6e4,e=s+(+$('#du').value||1)*dur[$('#un').value],v={};o.forEach((_,i)=>v[i]=0);
 try{await D.collection('polls').add({title:t,o,v,n:0,start:s,end:e,created:Date.now(),code:rc(),owner:me.id,ownerName:me.name,ownerFollowers:me.followers||0});go('feed')}catch(x){$('#er').textContent=x.message}}

// ---------- حسابي ----------
function drawMe(){$('#main').innerHTML=`<div class="p"><h2>${E(me.name)}</h2><div class="u"><span>كود صفحتك (شاركه مع أصحابك)</span><b style="font-size:20px;color:var(--a)">${me.code}</b></div>
<div class="u"><span>المتابعين</span><b>${me.followers||0}</b></div><div class="u"><span>أصواتك</span><b>${me.votes||0}</b></div><button class="s" onclick="A.signOut()">تسجيل الخروج</button></div>`}

// ---------- الإدارة ----------
async function drawAdm(){const m=$('#main');m.innerHTML='<div class="p"><p class="m">جاري التحميل...</p></div>';
 const all=await D.collection('users').get(),us=all.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.votes||0)-(a.votes||0));
 m.innerHTML=`<div class="p"><h2>إجمالي الحسابات: ${us.length}</h2><h3>الأكثر تفاعلًا</h3><select id="lm" onchange="lst()"><option>10</option><option>50</option><option>100</option></select><div id="ul"></div>
 <h3>كل الانتخابات (${polls.length})</h3>`+polls.map(p=>`<div class="u"><span>${E(p.title)}<br><small class="m">${p.n||0} صوت • ${p.code}</small></span><button class="s" onclick="del('${p.id}')">حذف</button></div>`).join('')+'</div>';
 window._us=us;lst()}
function lst(){const k=+$('#lm').value;$('#ul').innerHTML=_us.slice(0,k).map((u,i)=>`<div class="u"><span>${i+1}. ${E(u.name)}</span><b>${u.votes||0} تفاعل</b></div>`).join('')}
async function del(id){if(confirm('حذف الانتخاب؟')){await D.doc('polls/'+id).delete();drawAdm()}}
</script></body></html>
